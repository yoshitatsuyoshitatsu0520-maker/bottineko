<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>キャラクター一覧｜ぼっちねこくんのふもふも広場</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap"
        rel="stylesheet"
    >
</head>


<body>

    <!-- =========================
         背景
    ========================== -->
    <div class="background"></div>


    <!-- =========================
         メインコンテンツ
    ========================== -->
    <main class="container character-page">


        <!-- =========================
             ページタイトル
        ========================== -->
        <header class="page-header">

            <h1>キャラクター一覧</h1>

            <p>
                ボクたちの紹介をするね！
            </p>

        </header>



        <!-- =========================
             主要キャラクター
        ========================== -->
        <section class="characters-section">

    <div class="character-list">


        <!-- 主要キャラクター -->

        <div class="main-character-card">

            <img
                src="images/characters/teach2.png"
                alt="ティーチ"
            >

            <h3>ティーチ</h3>

            <p>
                すこし こわがりだけど ともだちおもいな やさしいおとこのこ ２７さい
            </p>

        </div>
        
        <div class="main-character-card">

            <img
                src="images/characters/sam.png"
                alt="サム"
            >

            <h3>サム</h3>

            <p>
                ティーチくんのことが だいすきな じぶんのこと おとうとだと おもいこんでる ウサギみたいな キメラ １２さい
            </p>

        </div>

        <div class="main-character-card">

            <img
                src="images/characters/kobayashi.png"
                alt="コバヤシ"
            >

            <h3>コバヤシ</h3>

            <p>
                めうえのひと や おきゃくさま には こび を うる ちてきで あたまがいい おとこのこ ３４さい
            </p>

        </div>




        <!-- その他のキャラクター -->

        <div class="character-icon-card">
            <img src="images/characters/character04.png" alt="">
            <p>だだ</p>
        </div>

        <div class="character-icon-card">
            <img src="images/characters/character05.png" alt="">
            <p>ブライアン</p>
        </div>

        <div class="character-icon-card">
            <img src="images/characters/character06.png" alt="">
            <p>大西</p>
        </div>

        <div class="character-icon-card">
            <img src="images/characters/character07.png" alt="">
            <p>スズノ</p>
        </div>

        <div class="character-icon-card">
            <img src="images/characters/character08.png" alt="">
            <p>終</p>
        </div>
        <div class="character-icon-card">
            <img src="images/characters/character09.png" alt="">
            <p>フアン</p>
        </div>
        <div class="character-icon-card">
            <img src="images/characters/character10.png" alt="">
            <p>デリート</p>
        </div>
        <div class="character-icon-card">
            <img src="images/characters/character11.png" alt="">
            <p>レア</p>
        </div>
        <div class="character-icon-card">
            <img src="images/characters/character12.png" alt="">
            <p>ボツ</p>
        </div>

        <div class="character-icon-card">
            <img src="images/characters/character13.png" alt="">
            <p>オリ</p>
        </div>

        <div class="character-icon-card">
            <img src="images/characters/character14.png" alt="">
            <p>スミス</p>
        </div>

        <div class="character-icon-card">
            <img src="images/characters/character15.png" alt="">
            <p>ひみつの親友</p>
        </div>

    </div>

</section>


        <!-- =========================
             戻るボタン
        ========================== -->
        <a
            href="index.html"
            class="back-button"
        >
            🏠 トップページへ戻る
        </a>


    </main>

<!-- =========================
     BGM
========================= -->
<div class="bgm-control">

    <button id="bgmButton" type="button">
        🎵 BGM ON
    </button>

    <audio id="bgm" loop>
        <source src="audio/bgm.mp3" type="audio/mpeg">
    </audio>

</div>


<!-- =========================
     キウイ
========================= -->
<img
    id="cursorKiwi"
    src="images/kiwi.png"
    alt=""
>


<!-- =========================
     JavaScript
========================= -->
<script src="js/teach.js"></script>

</body>
</html>

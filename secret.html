<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>なにこれ</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #050505;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            font-family:
                sans-serif;
        }


        /* =========================
           動画
        ========================= */

        #secretVideo {

            width: 100vw;
            height: 100vh;

            object-fit: contain;

            background: #000;

        }


        /* =========================
           戻るボタン
        ========================= */

        #backButton {

            position: fixed;

            bottom: 20px;
            left: 50%;

            transform: translateX(-50%);

            padding: 8px 18px;

            background: rgba(0, 0, 0, 0.7);

            color: white;

            border: 1px solid #555;

            border-radius: 5px;

            cursor: pointer;

            opacity: 0;

            transition: 0.3s;

        }


        #backButton:hover {

            opacity: 1;

        }

    </style>

</head>


<body>


    <!-- =========================
         謎動画
    ========================= -->

    <video
        id="secretVideo"
        autoplay
        playsinline
        controls
    >

        <source
            src="videos/nazo.mp4"
            type="video/mp4"
        >

        お使いのブラウザでは動画を再生できません。

    </video>


    <!-- =========================
         トップへ戻る
    ========================= -->

    <button
        id="backButton"
        onclick="location.href='index.html'"
    >

        トップページへ戻る

    </button>


</body>

</html>

<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ねこティチファンクラブ掲示板｜ねこのティーチくんファンサイト</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="background"></div>

<main class="container">

    <!-- =========================
         ヘッダー
    ========================== -->

    <header class="board-page-header">

        <h1>ねこティチファンクラブ掲示板</h1>

        <p>
            ねこのティーチくんについて気軽に自由に語ろうぜ！<br>考察なども大歓迎！
        </p>

    </header>


    <!-- =========================
         投稿者モード選択
    ========================== -->

    <div
        id="mode-select"
        class="member-mode-box"
    >

        <h2>
            確認
        </h2>

        <p>
            あなたはファンクラブに参加していますか？
        </p>

        <div class="mode-buttons">

            <button
                id="member-mode-button"
                type="button"
            >
                はい
            </button>

            <button
                id="guest-mode-button"
                type="button"
            >
                いいえ
            </button>

        </div>

    </div>


    <!-- =========================
         会員情報選択
    ========================== -->

    <div
        id="member-name-select"
        class="member-mode-box"
        style="display:none;"
    >

        <h2>
            会員情報が見つかりました！
        </h2>

        <p>
            登録している名前で投稿しますか？
        </p>

        <div class="member-info-box">

            <span>
                名前：
                <strong id="found-member-name">
                    ---
                </strong>
            </span>

            <span>
                推し：
                <strong id="found-member-favorite">
                    ---
                </strong>
            </span>

        </div>

        <div class="mode-buttons">

            <button
                id="registered-name-button"
                type="button"
            >
                登録名で投稿
            </button>

            <button
                id="member-guest-button"
                type="button"
            >
                ゲストとして投稿
            </button>

        </div>

    </div>


    <!-- =========================
         手入力モード
    ========================== -->

    <div
        id="manual-member-mode"
        class="member-mode-box"
        style="display:none;"
    >

        <h2>
            会員情報を確認できませんでした
        </h2>

        <p>
            名前を入力して、推しを選んでね！
        </p>

        <p>
            ※ここで入力・選択した情報は会員情報には登録されません。
        </p>


        <div class="manual-input-area">

            <label for="manual-name">
                名前
            </label>

            <input
                id="manual-name"
                type="text"
                maxlength="30"
                placeholder="名前を入力"
            >


            <label for="manual-favorite">
                推し
            </label>

            <select id="manual-favorite">

                <option value="ティーチ">
                    ティーチ
                </option>

                <option value="サム">
                    サム
                </option>

                <option value="コバヤシ">
                    コバヤシ
                </option>

                <option value="だだ">
                    だだ
                </option>

                <option value="ブライアン">
                    ブライアン
                </option>

                <option value="大西">
                    大西
                </option>

                <option value="スズノ">
                    スズノ
                </option>

                <option value="終">
                    終
                </option>

                <option value="フアン">
                    フアン
                </option>

                <option value="デリート">
                    デリート
                </option>

                <option value="レア">
                    レア
                </option>

                <option value="ボツ">
                    ボツ
                </option>

                <option value="オリ">
                    オリ
                </option>

                <option value="スミス">
                    スミス
                </option>

                <option value="ひみつの親友">
                    ひみつの親友
                </option>

                <option value="箱推し">
                    箱推し
                </option>

                <option value="その他">
                    その他
                </option>

            </select>


            <!-- その他を選んだときだけ表示 -->

            <div
                id="other-favorite-area"
                style="display:none;"
            >

                <label for="other-favorite">
                    推しの名前
                </label>

                <input
                    id="other-favorite"
                    type="text"
                    maxlength="30"
                    placeholder="推しの名前を入力してね"
                >

            </div>

        </div>


        <div class="mode-buttons">

            <button
                id="manual-start-button"
                type="button"
            >
                この名前で投稿
            </button>

            <button
                id="manual-guest-button"
                type="button"
            >
                ゲストとして投稿
            </button>

        </div>

    </div>


    <!-- =========================
         掲示板
    ========================== -->

    <div
        id="board-content"
        style="display:none;"
    >

        <!-- 投稿一覧 -->

        <section class="board-box">

            <div class="board-box-header">
                🥝 総合掲示板（上にスクロールできます）
            </div>

            <div id="post-list">

                <div class="board-loading">
                    投稿を読み込んでいます……
                </div>

            </div>

        </section>


        <!-- =========================
             投稿フォーム
        ========================== -->

        <div class="post-form">

            <!-- 返信モード表示 -->

            <div
                id="reply-info"
                class="reply-info"
                style="display:none;"
            >

                <span id="reply-target">
                    返信先：---
                </span>

                <button
                    id="cancel-reply-button"
                    type="button"
                >
                    返信をキャンセル
                </button>

            </div>


            <h3 id="post-form-title">
                投稿
            </h3>


            <div
                class="member-info-box"
                id="member-info-box"
            >

                <span>
                    名前：
                    <strong id="member-name">
                        ゲスト
                    </strong>
                </span>

                <span>
                    推し：
                    <strong id="member-favorite">
                        未設定
                    </strong>
                </span>

            </div>


            <textarea
                id="post-message"
                maxlength="1000"
                placeholder="メッセージを書く"
            ></textarea>

            <div class="image-upload-area">

    <label
        for="post-image"
        class="image-upload-button"
    >
        📷 画像を選択
    </label>

    <input
        id="post-image"
        type="file"
        accept="image/png,image/jpeg,image/gif,image/webp"
        style="display:none;"
    >

    <div
        id="image-preview"
        class="image-preview"
    ></div>

</div>


            <button
                id="post-button"
                type="button"
            >
                投稿する
            </button>

        </div>

    </div>


    <!-- =========================
         戻る
    ========================== -->

    <div class="board-back">

        <a
            href="index.html"
            class="board-back-button"
        >
            ← トップページへ戻る
        </a>

    </div>

    <div class="bgm-control">

    <button id="bgmButton" type="button">
        🎵 BGM ON
    </button>

    <audio id="bgm" loop>
        <source src="audio/2.mp3" type="audio/mpeg">
    </audio>

</div>

</main>

<img
    id="cursorKiwi"
    src="images/kiwi.png"
    alt=""
>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";
/* =========================================
   Firebase
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAIwaGRB6ffUB1t7emLsXqFpfYDQ5d7WgQ",

    authDomain:
        "teach-fanclub.firebaseapp.com",

    projectId:
        "teach-fanclub",

    storageBucket:
        "teach-fanclub.firebasestorage.app",

    messagingSenderId:
        "350154920039",

    appId:
        "1:350154920039:web:20f0f1c2fbe0780e1044c2"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);
const storage =
    getStorage(app);
/* =========================================
   画像プレビュー
========================================= */

/* =========================================
   HTML取得
========================================= */

const modeSelect =
    document.getElementById("mode-select");

const memberModeButton =
    document.getElementById("member-mode-button");

const guestModeButton =
    document.getElementById("guest-mode-button");

const memberNameSelect =
    document.getElementById("member-name-select");

const registeredNameButton =
    document.getElementById("registered-name-button");

const memberGuestButton =
    document.getElementById("member-guest-button");

const manualMemberMode =
    document.getElementById("manual-member-mode");

const manualName =
    document.getElementById("manual-name");

const manualFavorite =
    document.getElementById("manual-favorite");

const otherFavoriteArea =
    document.getElementById("other-favorite-area");

const otherFavorite =
    document.getElementById("other-favorite");

const manualStartButton =
    document.getElementById("manual-start-button");

const manualGuestButton =
    document.getElementById("manual-guest-button");

const boardContent =
    document.getElementById("board-content");

const postList =
    document.getElementById("post-list");

const postMessage =
    document.getElementById("post-message");

const postButton =
    document.getElementById("post-button");

const postImage =
    document.getElementById("post-image");

const imagePreview =
    document.getElementById("image-preview");


/* =========================================
   画像プレビュー
========================================= */

postImage.addEventListener(
    "change",
    () => {

        imagePreview.innerHTML = "";

        const file =
            postImage.files[0];

        if (!file) {
            return;
        }

        if (
            file.size >
            5 * 1024 * 1024
        ) {

            alert(
                "画像は5MB以下にしてね！"
            );

            postImage.value = "";

            return;
        }

        const image =
            document.createElement("img");

        image.src =
            URL.createObjectURL(file);

        image.alt =
            "投稿画像プレビュー";

        imagePreview.appendChild(
            image
        );

    }
);

const memberNameElement =
    document.getElementById("member-name");
    

const memberFavoriteElement =
    document.getElementById("member-favorite");

const foundMemberName =
    document.getElementById("found-member-name");

const foundMemberFavorite =
    document.getElementById("found-member-favorite");

const replyInfo =
    document.getElementById("reply-info");

const replyTarget =
    document.getElementById("reply-target");

const cancelReplyButton =
    document.getElementById("cancel-reply-button");

const postFormTitle =
    document.getElementById("post-form-title");


/* =========================================
   会員ID
========================================= */

const myMemberId =
    localStorage.getItem(
        "teachFanclubMyMemberId"
    );


/* =========================================
   ゲストID
========================================= */

let myGuestId =
    localStorage.getItem(
        "teachFanclubGuestId"
    );


if (!myGuestId) {

    myGuestId =
        "guest_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2);

    localStorage.setItem(
        "teachFanclubGuestId",
        myGuestId
    );

}


/* =========================================
   投稿者情報
========================================= */

let memberName = "ゲスト";

let memberFavorite = "未設定";

let memberNumber = "";

let isMember = false;


/* =========================================
   返信状態
========================================= */

let replyParentId = "";

let replyParentNumber = "";

let replyParentName = "";


/* =========================================
   初回スクロール判定
========================================= */

let hasInitialScroll = false;


/* =========================================
   掲示板を最新位置へ移動
========================================= */

function scrollToLatest() {

    requestAnimationFrame(() => {

        postList.scrollTop =
            postList.scrollHeight;

    });

}


/* =========================================
   掲示板表示
========================================= */

function showBoard() {

    modeSelect.style.display =
        "none";

    memberNameSelect.style.display =
        "none";

    manualMemberMode.style.display =
        "none";

    boardContent.style.display =
        "block";

    postMessage.disabled =
        false;

    postButton.disabled =
        false;

    postMessage.placeholder =
        "メッセージを書いてね！";


    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            scrollToLatest();

            hasInitialScroll =
                true;

        });

    });

}


/* =========================================
   ゲストモード
========================================= */

function startGuestMode() {

    memberName =
        "ゲスト";

    memberFavorite =
        "未設定";

    memberNumber =
        "";

    isMember =
        false;


    memberNameElement.textContent =
        memberName;

    memberFavoriteElement.textContent =
        memberFavorite;


    showBoard();

}


/* =========================================
   手入力画面
========================================= */

function showManualMemberMode() {

    modeSelect.style.display =
        "none";

    memberNameSelect.style.display =
        "none";

    manualMemberMode.style.display =
        "block";

}


/* =========================================
   「その他」の表示
========================================= */

manualFavorite.addEventListener(
    "change",
    () => {

        if (
            manualFavorite.value ===
            "その他"
        ) {

            otherFavoriteArea.style.display =
                "block";

        } else {

            otherFavoriteArea.style.display =
                "none";

            otherFavorite.value =
                "";

        }

    }
);


/* =========================================
   手入力で開始
========================================= */

function startManualMode() {

    const name =
        manualName.value.trim();


    if (!name) {

        alert(
            "名前を入力してね！"
        );

        manualName.focus();

        return;

    }


    let favorite =
        manualFavorite.value;


    if (!favorite) {

        alert(
            "推しを選んでね！"
        );

        manualFavorite.focus();

        return;

    }


    if (
        favorite ===
        "その他"
    ) {

        favorite =
            otherFavorite.value.trim();


        if (!favorite) {

            alert(
                "推しの名前を入力してね！"
            );

            otherFavorite.focus();

            return;

        }

    }


    memberName =
        name;

    memberFavorite =
        favorite;

    memberNumber =
        "";

    isMember =
        false;


    memberNameElement.textContent =
        memberName;

    memberFavoriteElement.textContent =
        memberFavorite;


    showBoard();

}


/* =========================================
   会員情報取得
========================================= */

async function loadMyMember() {

    if (!myMemberId) {

        showManualMemberMode();

        return;

    }


    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "members"
                )
            );


        let myMember = null;


        snapshot.forEach(
            memberDoc => {

                if (
                    memberDoc.id ===
                    myMemberId
                ) {

                    myMember = {

                        id:
                            memberDoc.id,

                        ...memberDoc.data()

                    };

                }

            }
        );


        if (!myMember) {

            console.warn(
                "自分の会員情報が見つかりませんでした。"
            );

            showManualMemberMode();

            return;

        }


        memberName =
            myMember.name ||
            "ゲスト";

        memberFavorite =
            myMember.favorite ||
            "未設定";

        memberNumber =
            myMember.number ||
            "";

        isMember =
            true;


        foundMemberName.textContent =
            memberName;

        foundMemberFavorite.textContent =
            memberFavorite;


        modeSelect.style.display =
            "none";

        manualMemberMode.style.display =
            "none";

        memberNameSelect.style.display =
            "block";


    } catch (error) {

        console.error(
            "会員情報の取得に失敗しました。",
            error
        );

        showManualMemberMode();

    }

}


/* =========================================
   会員
========================================= */

memberModeButton.addEventListener(
    "click",
    async () => {

        memberModeButton.disabled =
            true;

        memberModeButton.textContent =
            "会員情報を確認中……";


        await loadMyMember();


        memberModeButton.disabled =
            false;

        memberModeButton.textContent =
            "はい";

    }
);


/* =========================================
   ゲスト
========================================= */

guestModeButton.addEventListener(
    "click",
    () => {

        startGuestMode();

    }
);


/* =========================================
   登録名
========================================= */

registeredNameButton.addEventListener(
    "click",
    () => {

        memberNameElement.textContent =
            memberName;

        memberFavoriteElement.textContent =
            memberFavorite;

        showBoard();

    }
);


/* =========================================
   会員 → ゲスト
========================================= */

memberGuestButton.addEventListener(
    "click",
    () => {

        startGuestMode();

    }
);


/* =========================================
   手入力
========================================= */

manualStartButton.addEventListener(
    "click",
    () => {

        startManualMode();

    }
);


/* =========================================
   手入力 → ゲスト
========================================= */

manualGuestButton.addEventListener(
    "click",
    () => {

        startGuestMode();

    }
);


/* =========================================
   返信モード開始
========================================= */

function startReplyMode(
    postId,
    postNumber,
    postName
) {

    replyParentId =
        postId;

    replyParentNumber =
        postNumber;

    replyParentName =
        postName;


    replyInfo.style.display =
        "flex";


    replyTarget.textContent =
        postNumber
            ? "返信先：No." +
              String(postNumber).padStart(3, "0") +
              "　" +
              postName
            : "返信先：" +
              postName;


    postFormTitle.textContent =
        "💬 返信する";


    postButton.textContent =
        "返信する";


    postMessage.placeholder =
        "返信メッセージを書く";


    postMessage.focus();


    /* 投稿フォームへ移動 */

    document
        .querySelector(".post-form")
        .scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

}


/* =========================================
   返信キャンセル
========================================= */

function cancelReply() {

    replyParentId =
        "";

    replyParentNumber =
        "";

    replyParentName =
        "";


    replyInfo.style.display =
        "none";


    postFormTitle.textContent =
        "投稿";


    postButton.textContent =
        "投稿する";


    postMessage.placeholder =
        "メッセージを書く";

}


/* =========================================
   返信キャンセルボタン
========================================= */

cancelReplyButton.addEventListener(
    "click",
    () => {

        cancelReply();

    }
);


/* =========================================
   Firestore 投稿
========================================= */

const postsRef =
    collection(
        db,
        "boardPosts"
    );


const postsQuery =
    query(
        postsRef,
        orderBy(
            "createdAt",
            "asc"
        )
    );


/* =========================================
   投稿一覧
========================================= */

onSnapshot(
    postsQuery,

    snapshot => {

        const wasNearBottom =
            postList.scrollHeight -
            postList.scrollTop -
            postList.clientHeight <
            80;


        postList.innerHTML =
            "";


        if (snapshot.empty) {

            postList.innerHTML = `

                <div class="board-loading">

                    まだ投稿がありません！<br>

                    最初の投稿をしてみよう 🐱

                </div>

            `;

            return;

        }


        /*
         * 通常投稿を先に表示
         */

        const posts = [];

        snapshot.forEach(
            postDoc => {

                posts.push({

                    id:
                        postDoc.id,

                    ...postDoc.data()

                });

            }
        );


        /*
         * 通常投稿
         */

        posts
            .filter(
                post =>
                    !post.parentId
            )
            .forEach(
                post => {

                    renderPost(
                        post,
                        false
                    );


                    /*
                     * この投稿への返信
                     */

                    posts
                        .filter(
                            reply =>
                                reply.parentId ===
                                post.id
                        )
                        .forEach(
                            reply => {

                                renderPost(
                                    reply,
                                    true
                                );

                            }
                        );

                }
            );


        /*
         * 初回表示・最下部付近なら
         * 最新位置へ
         */

        if (
            !hasInitialScroll ||
            wasNearBottom
        ) {

            scrollToLatest();

            hasInitialScroll =
                true;

        }

    },

    error => {

        console.error(
            "投稿の読み込みに失敗しました。",
            error
        );


        postList.innerHTML = `

            <div class="board-loading">

                投稿を読み込めませんでした…<br>

                Firebaseの設定やFirestoreのルールを確認してね。

            </div>

        `;

    }
);


/* =========================================
   投稿を画面に表示
========================================= */

function renderPost(
    post,
    isReply
) {

    const postElement =
        document.createElement(
            "article"
        );


    postElement.className =
        isReply
            ? "post-card reply-card"
            : "post-card";


    /* =====================================
       投稿者情報
    ===================================== */

    const memberElement =
        document.createElement(
            "div"
        );

    memberElement.className =
        "post-member";


    const nameElement =
        document.createElement(
            "div"
        );

    nameElement.className =
        "post-name";


    nameElement.textContent =
        post.number

            ? "" +
              "" +
              (
                  post.name ||
                  "名無し"
              )

            :

              (
                  post.name ||
                  "名無し"
              );


    const favoriteElement =
        document.createElement(
            "div"
        );

    favoriteElement.className =
        "post-favorite";


    favoriteElement.textContent =
        "推し：" +
        (
            post.favorite ||
            "未設定"
        );


    const dateElement =
        document.createElement(
            "div"
        );

    dateElement.className =
        "post-date";


    if (post.createdAt) {

        const date =
            post.createdAt.toDate();


        dateElement.textContent =

            date.getFullYear() +
            "/" +

            String(
                date.getMonth() + 1
            ).padStart(
                2,
                "0"
            ) +

            "/" +

            String(
                date.getDate()
            ).padStart(
                2,
                "0"
            ) +

            " " +

            String(
                date.getHours()
            ).padStart(
                2,
                "0"
            ) +

            ":" +

            String(
                date.getMinutes()
            ).padStart(
                2,
                "0"
            );

    }


    memberElement.appendChild(
        nameElement
    );

    memberElement.appendChild(
        favoriteElement
    );

    memberElement.appendChild(
        dateElement
    );


    /* =====================================
       本文
    ===================================== */

    const messageElement =
        document.createElement(
            "div"
        );

    messageElement.className =
        "post-message";


    messageElement.textContent =
        post.message ||
        "";


    postElement.appendChild(
        memberElement
    );

    postElement.appendChild(
        messageElement
    );

    /* =====================================
   投稿画像
===================================== */

if (post.imageUrl) {

    const imageElement =
        document.createElement("img");

    imageElement.className =
        "post-image";

    imageElement.src =
        post.imageUrl;

    imageElement.alt =
        "投稿画像";

    imageElement.loading =
        "lazy";


    imageElement.addEventListener(
        "click",
        () => {

            window.open(
                post.imageUrl,
                "_blank"
            );

        }
    );


    postElement.appendChild(
        imageElement
    );

}


    /* =====================================
       ボタンエリア
    ===================================== */

    const actionArea =
        document.createElement(
            "div"
        );

    actionArea.className =
        "post-action-area";


    /*
     * 通常投稿だけ返信可能
     */

    if (!isReply) {

        const replyButton =
            document.createElement(
                "button"
            );


        replyButton.className =
            "post-reply-button";

        replyButton.textContent =
            "返信する";

        replyButton.type =
            "button";


        replyButton.addEventListener(
            "click",
            () => {

                startReplyMode(
                    post.id,
                    post.number || "",
                    post.name || "名無し"
                );

            }
        );


        actionArea.appendChild(
            replyButton
        );

    }


    /* =====================================
       自分の投稿なら削除
    ===================================== */

    const isMyMemberPost =
        post.memberId &&
        post.memberId ===
        myMemberId;


    const isMyGuestPost =
        post.guestId &&
        post.guestId ===
        myGuestId;


    if (
        isMyMemberPost ||
        isMyGuestPost
    ) {

        const deleteButton =
            document.createElement(
                "button"
            );


        deleteButton.className =
            "post-delete-button";

        deleteButton.textContent =
            "🗑️ 削除";

        deleteButton.type =
            "button";


        deleteButton.addEventListener(
            "click",
            async () => {

                if (
                    !confirm(
                        "この投稿を削除しますか？"
                    )
                ) {

                    return;

                }


                try {

                    deleteButton.disabled =
                        true;

                    deleteButton.textContent =
                        "削除中……";


                    await deleteDoc(
                        doc(
                            db,
                            "boardPosts",
                            post.id
                        )
                    );


                } catch (error) {

                    console.error(
                        "投稿の削除に失敗しました。",
                        error
                    );


                    alert(
                        "投稿を削除できませんでした……"
                    );


                    deleteButton.disabled =
                        false;

                    deleteButton.textContent =
                        "🗑️ 削除";

                }

            }
        );


        actionArea.appendChild(
            deleteButton
        );

    }


    /*
     * ボタンがある場合だけ追加
     */

    if (
        actionArea.children.length > 0
    ) {

        postElement.appendChild(
            actionArea
        );

    }


    postList.appendChild(
        postElement
    );

}


/* =========================================
   投稿・返信
========================================= */

postButton.addEventListener(
    "click",
    async () => {

        const message =
    postMessage.value.trim();

const imageFile =
    postImage.files[0];


/*
 * メッセージも画像もない場合
 */

if (
    !message &&
    !imageFile
) {

    alert(
        "メッセージか画像を入れてね！"
    );

    return;

}


        postButton.disabled =
            true;

        postButton.textContent =
            replyParentId
                ? "返信中……"
                : "投稿中……";


        try {
            let imageUrl = "";
let imagePath = "";

if (imageFile) {

    const safeFileName =
        imageFile.name
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );

    imagePath =
        "boardImages/" +
        myGuestId +
        "_" +
        Date.now() +
        "_" +
        safeFileName;


    const imageRef =
        ref(
            storage,
            imagePath
        );


    await uploadBytes(
        imageRef,
        imageFile
    );


    imageUrl =
        await getDownloadURL(
            imageRef
        );

}

            await addDoc(
    postsRef,
    {

        name:
            memberName,

        favorite:
            memberFavorite,

        number:
            isMember
                ? memberNumber
                : "",

        memberId:
            isMember
                ? myMemberId
                : "",

        guestId:
            isMember
                ? ""
                : myGuestId,

        message:
            message,

        imageUrl:
            imageUrl,

        imagePath:
            imagePath,

        parentId:
            replyParentId || "",

        createdAt:
            serverTimestamp()

    }
);


            postMessage.value =
                "";

                postImage.value =
    "";

imagePreview.innerHTML =
    "";


            /*
             * 返信モードを解除
             */

            cancelReply();


        } catch (error) {

            console.error(
                "投稿に失敗しました。",
                error
            );


            alert(
                "投稿できませんでした……"
            );


        } finally {

            postButton.disabled =
                false;


            postButton.textContent =
                replyParentId
                    ? "返信する"
                    : "投稿する";

        }

    }
);

</script>
